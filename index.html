<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResumeSync AI – Customize Resume</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #1f2937;
    }
    label {
      font-weight: bold;
      margin-top: 1rem;
      display: block;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-top: 0.5rem;
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      resize: vertical;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #0d9488;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #0f766e;
    }
    pre {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ResumeSync AI</h1>
    <form id="customizeForm">
      <label for="jobDesc">Job Description</label>
      <textarea id="jobDesc" required></textarea>

      <label for="resume">Your Resume</label>
      <textarea id="resume" required></textarea>

      <button type="submit">Customize Resume</button>
    </form>

    <h2>Customized Resume Output</h2>
    <pre id="resumeOutput"></pre>
  </div>

  <script>
    document.getElementById("customizeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const job_description = document.getElementById("jobDesc").value;
      const user_resume = document.getElementById("resume").value;

      const response = await fetch("https://your-api-url.com/customize-resume", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ job_description, user_resume })
      });

      const result = await response.json();
      document.getElementById("resumeOutput").textContent = result.customized_resume || result.error;
    });
  </script>
</body>
</html>
